<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Sri Dhesamma temple at night">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.6" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#131b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gopuraGrad" x1="0" y1="1" x2="0" y2="0">
